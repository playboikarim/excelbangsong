<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>엑셀방송 LIVE</title>
<meta name="description" content="내 얼굴 캐릭터가 후원 금액에 따라 리액션하는 엑셀방송 시뮬레이터">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0918; --panel:#161229; --panel2:#1e1938; --line:#2d2752; --text:#f4f0ff; --muted:#a49bcc;
  --pink:#ff3d8b; --yellow:#ffd23f; --mint:#3df5c8; --sky:#7fd3ff;
  --xl:#1d6f42; --xlgrid:#d4d4d4; --skin:#ffd9b8; --outfit:#ff3d8b;
  --beat:.4839s;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}

/* ---------- SETUP ---------- */
.setup{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;
  background:radial-gradient(1200px 600px at 20% -10%,#3a1460 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#5b0f3a 0,transparent 60%),var(--bg)}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px 24px;box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center}
.brand{display:inline-flex;align-items:center;gap:8px;font-family:"Black Han Sans";font-size:15px;letter-spacing:.5px;color:var(--muted);background:var(--panel2);padding:6px 12px;border-radius:999px}
.brand b{color:#fff;background:#e5143c;padding:1px 7px;border-radius:5px;font-weight:400}
.dot{width:8px;height:8px;border-radius:50%;background:#ff2b4f;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.card h1{font-family:"Black Han Sans";font-weight:400;font-size:30px;margin:16px 0 6px;line-height:1.2}
.sub{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:20px}
.face-edit{position:relative;width:200px;height:200px;margin:0 auto 12px}
#faceCanvas{width:200px;height:200px;border-radius:50%;border:5px solid #fff;background:var(--skin);touch-action:none;cursor:grab;box-shadow:0 10px 30px rgba(255,61,139,.35)}
#faceCanvas:active{cursor:grabbing}
.face-hint{font-size:12px;color:var(--muted);margin-top:6px}
.upload{display:inline-flex;align-items:center;gap:6px;margin-top:22px;padding:10px 16px;border-radius:12px;background:var(--panel2);border:1px dashed #5a4f95;font-weight:700;font-size:14px;cursor:pointer}
.upload input{display:none}
.zoom-row{display:flex;align-items:center;gap:10px;justify-content:center;margin:12px 0 0;font-size:13px;color:var(--muted)}
.zoom-row input{width:160px;accent-color:var(--pink)}
.field{display:block;text-align:left;margin-top:20px;font-size:13px;color:var(--muted);font-weight:700}
.field input{display:block;width:100%;margin-top:6px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0f0c20;font-size:16px;outline:none}
.field input:focus{border-color:var(--pink)}
.swatches{display:flex;gap:10px;margin-top:8px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;outline:2px solid transparent}
.sw.on{border-color:#fff}
.start{width:100%;margin-top:24px;padding:16px;border-radius:14px;background:linear-gradient(90deg,#ff2b4f,var(--pink));font-family:"Black Han Sans";font-size:20px;box-shadow:0 10px 30px rgba(255,43,79,.4);transition:transform .1s}
.start:active{transform:scale(.97)}
.privacy{font-size:12px;color:var(--muted);margin-top:12px}

/* ---------- APP LAYOUT ---------- */
.app{display:grid;grid-template-columns:1fr 380px;grid-template-rows:1fr auto;height:100dvh}
.stage{grid-column:1;grid-row:1;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 120%,#5a1f8f 0,#1a0f3a 45%,#0a0716 80%)}
.controls{grid-column:1;grid-row:2;background:var(--panel);border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.side{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}

/* stage decor */
.beam{position:absolute;top:-20%;width:60%;height:140%;opacity:.35;mix-blend-mode:screen;pointer-events:none;filter:blur(6px)}
.beam.a{left:-10%;background:conic-gradient(from 160deg at 50% 0,transparent 0 8deg,#ff3d8b 12deg,transparent 18deg 360deg);animation:sweepA 4s ease-in-out infinite alternate}
.beam.b{right:-10%;background:conic-gradient(from 180deg at 50% 0,transparent 0 6deg,#3df5c8 10deg,transparent 16deg 360deg);animation:sweepB 3.2s ease-in-out infinite alternate}
.beam.c{left:20%;background:conic-gradient(from 170deg at 50% 0,transparent 0 8deg,#ffd23f 11deg,transparent 15deg 360deg);animation:sweepA 5s ease-in-out infinite alternate-reverse;opacity:.2}
@keyframes sweepA{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}
@keyframes sweepB{from{transform:rotate(25deg)}to{transform:rotate(-25deg)}}
.floor{position:absolute;left:50%;bottom:3%;width:min(70%,520px);aspect-ratio:5/1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,61,139,.55),rgba(120,40,200,.25) 60%,transparent);animation:floorPulse var(--beat) ease-out infinite}
@keyframes floorPulse{0%{filter:brightness(1.6)}100%{filter:brightness(.9)}}
.eq{position:absolute;left:0;right:0;bottom:0;height:22%;display:flex;align-items:flex-end;gap:3px;padding:0 6px;opacity:.28;pointer-events:none}
.eq i{flex:1;background:linear-gradient(to top,var(--pink),var(--yellow));border-radius:3px 3px 0 0;height:20%;animation:eq var(--d) ease-in-out infinite alternate}
@keyframes eq{to{height:var(--h)}}
.stage.party{animation:hue 1.2s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.stage.shake{animation:shake .12s linear infinite}
.stage.party.shake{animation:hue 1.2s linear infinite,shake .12s linear infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-5px,3px)}50%{transform:translate(4px,-4px)}75%{transform:translate(-3px,-2px)}100%{transform:translate(0,0)}}

/* HUD */
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;z-index:20;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);padding:5px 10px;border-radius:8px;font-size:13px;font-weight:700}
.pill.live{background:#e5143c;font-family:"Black Han Sans";font-weight:400;letter-spacing:.5px}
.pill.live .dot{background:#fff}
.goal{margin-left:auto;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);border-radius:10px;padding:7px 10px;min-width:200px;max-width:46%}
.goal .t{display:flex;justify-content:space-between;font-size:12px;font-weight:700;gap:8px}
.goal .t span:last-child{color:var(--yellow)}
.goal .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.15);margin-top:5px;overflow:hidden}
.goal .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--yellow));transition:width .6s}
.title{position:absolute;top:56px;left:0;right:0;text-align:center;font-family:"Black Han Sans";font-size:clamp(20px,3.4vw,34px);z-index:5;pointer-events:none;
  background:linear-gradient(90deg,#fff,var(--yellow),#fff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(255,210,63,.25)}

/* CHARACTER */
.char-wrap{position:absolute;left:50%;bottom:5%;width:220px;height:380px;transform:translateX(-50%) scale(var(--s,1));transform-origin:50% 100%;z-index:10}
.char{position:absolute;inset:0;transform-origin:50% 92%}
.char>*{position:absolute}
.head{left:35px;top:0;width:150px;height:150px;border-radius:50%;overflow:hidden;border:5px solid #fff;background:var(--skin);z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.45);transform-origin:50% 95%}
.head img{width:100%;height:100%;object-fit:cover;display:block}
.crown{left:80px;top:-56px;font-size:58px;z-index:4;display:none;animation:crownBob .5s ease-in-out infinite alternate;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.char.crowned .crown{display:block}
@keyframes crownBob{to{transform:translateY(-6px) rotate(6deg)}}
.torso{left:62px;top:138px;width:96px;height:112px;border-radius:34px 34px 22px 22px;background:var(--outfit);z-index:2;display:grid;place-items:center;color:rgba(255,255,255,.9);font-size:30px}
.arm{top:146px;width:24px;height:96px;border-radius:12px;background:var(--outfit);filter:brightness(.85);transform-origin:12px 12px;z-index:1}
.arm::after{content:"";position:absolute;left:-4px;bottom:-14px;width:32px;height:32px;border-radius:50%;background:var(--skin)}
.arm.l{left:46px;transform:rotate(12deg)}
.arm.r{left:150px;transform:rotate(-12deg)}
.leg{top:236px;width:30px;height:104px;border-radius:14px;background:#2b2d6e;transform-origin:15px 6px;z-index:1}
.leg::after{content:"";position:absolute;bottom:-8px;left:-7px;width:44px;height:22px;border-radius:12px 12px 8px 8px;background:#fff}
.leg.l{left:74px}.leg.r{left:116px}

/* modes */
.m-idle{animation:bob calc(var(--beat)*2) ease-in-out infinite}
.m-idle .head{animation:tilt calc(var(--beat)*4) ease-in-out infinite}
.m-idle .arm.l{animation:idleL calc(var(--beat)*2) ease-in-out infinite}
.m-idle .arm.r{animation:idleR calc(var(--beat)*2) ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes idleL{0%,100%{transform:rotate(8deg)}50%{transform:rotate(22deg)}}
@keyframes idleR{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-22deg)}}

.m-wave{animation:bob var(--beat) ease-in-out infinite}
.m-wave .head{animation:tilt .7s ease-in-out infinite}
.m-wave .arm.r{animation:wave .28s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-125deg)}to{transform:rotate(-170deg)}}

.m-aegyo{animation:squish var(--beat) ease-in-out infinite}
.m-aegyo .head{animation:tilt .45s ease-in-out infinite}
.m-aegyo .arm{z-index:4}
.m-aegyo .arm.l{animation:pingL .22s ease-in-out infinite alternate}
.m-aegyo .arm.r{animation:pingR .22s ease-in-out infinite alternate}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.95)}}
@keyframes pingL{from{transform:rotate(158deg)}to{transform:rotate(172deg)}}
@keyframes pingR{from{transform:rotate(-158deg)}to{transform:rotate(-172deg)}}

.m-dance{animation:danceBody calc(var(--beat)*2) ease-in-out infinite}
.m-dance .head{animation:tilt var(--beat) ease-in-out infinite}
.m-dance .arm.l{animation:danceL var(--beat) ease-in-out infinite}
.m-dance .arm.r{animation:danceR var(--beat) ease-in-out infinite}
.m-dance .leg.l{animation:kickL var(--beat) ease-in-out infinite}
.m-dance .leg.r{animation:kickR var(--beat) ease-in-out infinite}
@keyframes danceBody{0%,100%{transform:translateY(0) rotate(-7deg)}25%,75%{transform:translateY(-16px) rotate(0)}50%{transform:translateY(0) rotate(7deg)}}
@keyframes danceL{0%,100%{transform:rotate(170deg)}50%{transform:rotate(35deg)}}
@keyframes danceR{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(-170deg)}}
@keyframes kickL{0%,100%{transform:rotate(0)}50%{transform:rotate(22deg)}}
@keyframes kickR{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(0)}}

.m-jump{animation:spinJump 1.1s cubic-bezier(.3,.7,.4,1) infinite}
.m-jump .arm.l{animation:upL .18s ease-in-out infinite alternate}
.m-jump .arm.r{animation:upR .18s ease-in-out infinite alternate}
.m-jump .leg.l{transform:rotate(28deg)}.m-jump .leg.r{transform:rotate(-28deg)}
@keyframes spinJump{0%{transform:translateY(0) rotate(0) scale(1,1)}10%{transform:translateY(0) scale(1.08,.9)}40%{transform:translateY(-130px) rotate(0) scale(.95,1.05)}70%{transform:translateY(-130px) rotate(360deg)}92%{transform:translateY(0) rotate(360deg) scale(1.08,.9)}100%{transform:translateY(0) rotate(360deg) scale(1,1)}}
@keyframes upL{from{transform:rotate(150deg)}to{transform:rotate(175deg)}}
@keyframes upR{from{transform:rotate(-150deg)}to{transform:rotate(-175deg)}}

.m-crazy{animation:crazy .26s linear infinite}
.m-crazy .head{animation:bighead .26s ease-in-out infinite alternate}
.m-crazy .arm.l{animation:flailL .2s linear infinite}
.m-crazy .arm.r{animation:flailR .23s linear infinite}
.m-crazy .leg.l{animation:kickL .2s linear infinite}
.m-crazy .leg.r{animation:kickR .2s linear infinite}
@keyframes crazy{0%{transform:translate(0,0) rotate(-10deg)}25%{transform:translate(-14px,-24px) rotate(8deg)}50%{transform:translate(10px,0) rotate(-6deg)}75%{transform:translate(14px,-20px) rotate(12deg)}100%{transform:translate(0,0) rotate(-10deg)}}
@keyframes bighead{from{transform:scale(1.15) rotate(-12deg)}to{transform:scale(1.4) rotate(12deg)}}
@keyframes flailL{0%{transform:rotate(20deg)}50%{transform:rotate(200deg)}100%{transform:rotate(20deg)}}
@keyframes flailR{0%{transform:rotate(-200deg)}50%{transform:rotate(-20deg)}100%{transform:rotate(-200deg)}}

.m-bow{animation:bow 2s ease-out forwards}
.m-bow .head{animation:bowHead 2s ease-out forwards}
.m-bow .arm.l{transform:rotate(-8deg)}.m-bow .arm.r{transform:rotate(8deg)}
@keyframes bow{0%{transform:none}30%,100%{transform:translateY(70px) scale(1.04,.8)}}
@keyframes bowHead{0%{transform:none}30%,100%{transform:translateY(46px) scale(.98)}}

/* challenges */
.deco{left:150px;top:-30px;font-size:52px;z-index:4;display:none;transform:rotate(18deg);filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.char.has-deco .deco{display:block;animation:decoBob var(--beat) ease-in-out infinite alternate}
@keyframes decoBob{from{transform:rotate(18deg)}to{transform:rotate(-8deg) translateY(-8px) scale(1.1)}}

.m-bunny{animation:hop var(--beat) cubic-bezier(.3,.6,.5,1) infinite}
.m-bunny .arm{z-index:4}
.m-bunny .arm.l{animation:earL calc(var(--beat)/2) ease-in-out infinite alternate}
.m-bunny .arm.r{animation:earR calc(var(--beat)/2) ease-in-out infinite alternate}
.m-bunny .leg.l{transform:rotate(-6deg)}.m-bunny .leg.r{transform:rotate(6deg)}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.06,.92)}45%{transform:translateY(-48px) scale(.96,1.05)}}
@keyframes earL{from{transform:rotate(166deg)}to{transform:rotate(182deg)}}
@keyframes earR{from{transform:rotate(-166deg)}to{transform:rotate(-182deg)}}

.m-robot{animation:robotBody calc(var(--beat)*4) steps(1,end) infinite}
.m-robot .head{animation:robotHead calc(var(--beat)*2) steps(1,end) infinite}
.m-robot .arm.l{animation:robotL calc(var(--beat)*4) steps(1,end) infinite}
.m-robot .arm.r{animation:robotR calc(var(--beat)*4) steps(1,end) infinite}
@keyframes robotBody{0%{transform:none}25%{transform:rotate(-6deg) translateX(-10px)}50%{transform:translateY(-12px)}75%{transform:rotate(6deg) translateX(10px)}}
@keyframes robotHead{0%{transform:none}25%{transform:rotate(-15deg)}50%{transform:none}75%{transform:rotate(15deg)}}
@keyframes robotL{0%{transform:rotate(90deg)}25%{transform:rotate(180deg)}50%{transform:rotate(90deg)}75%{transform:rotate(0deg)}}
@keyframes robotR{0%{transform:rotate(-90deg)}25%{transform:rotate(0deg)}50%{transform:rotate(-90deg)}75%{transform:rotate(-180deg)}}

.m-surf{animation:bodyWave calc(var(--beat)*2) ease-in-out infinite}
.m-surf .head{animation:headWave calc(var(--beat)*2) ease-in-out infinite}
.m-surf .arm.l{animation:armWaveL calc(var(--beat)*2) ease-in-out infinite}
.m-surf .arm.r{animation:armWaveR calc(var(--beat)*2) ease-in-out infinite;animation-delay:calc(var(--beat)*-.5)}
@keyframes bodyWave{0%,100%{transform:skewX(8deg) translateX(-10px)}50%{transform:skewX(-8deg) translateX(10px)}}
@keyframes headWave{0%,100%{transform:translateX(-18px) rotate(-6deg)}50%{transform:translateX(18px) rotate(6deg)}}
@keyframes armWaveL{0%,100%{transform:rotate(70deg)}50%{transform:rotate(125deg)}}
@keyframes armWaveR{0%,100%{transform:rotate(-70deg)}50%{transform:rotate(-125deg)}}

.m-hip{animation:hip var(--beat) ease-in-out infinite alternate}
.m-hip .head{animation:tilt calc(var(--beat)*2) ease-in-out infinite}
.m-hip .arm.l{transform:rotate(38deg)}.m-hip .arm.r{transform:rotate(-38deg)}
.m-hip .leg.l{animation:hipLeg var(--beat) ease-in-out infinite alternate}
.m-hip .leg.r{animation:hipLeg var(--beat) ease-in-out infinite alternate-reverse}
@keyframes hip{from{transform:translateX(-22px) rotate(5deg)}to{transform:translateX(22px) rotate(-5deg)}}
@keyframes hipLeg{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}

.m-disco{animation:bob var(--beat) ease-in-out infinite}
.m-disco .head{animation:discoHead calc(var(--beat)*2) steps(1,end) infinite}
.m-disco .arm.l{transform:rotate(30deg)}
.m-disco .arm.r{animation:point calc(var(--beat)*2) ease-in-out infinite}
.m-disco .leg.r{animation:kickR var(--beat) ease-in-out infinite}
@keyframes point{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-30deg)}}
@keyframes discoHead{0%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}

.m-penguin{animation:waddle var(--beat) ease-in-out infinite alternate}
.m-penguin .arm.l{animation:flapL calc(var(--beat)/2) ease-in-out infinite alternate}
.m-penguin .arm.r{animation:flapR calc(var(--beat)/2) ease-in-out infinite alternate}
.m-penguin .leg.l{animation:kickL var(--beat) ease-in-out infinite}
.m-penguin .leg.r{animation:kickR var(--beat) ease-in-out infinite}
@keyframes waddle{from{transform:rotate(-10deg) translateX(-8px)}to{transform:rotate(10deg) translateX(8px)}}
@keyframes flapL{from{transform:rotate(5deg)}to{transform:rotate(42deg)}}
@keyframes flapR{from{transform:rotate(-5deg)}to{transform:rotate(-42deg)}}

/* chant */
.chant{position:absolute;left:0;right:0;top:50px;text-align:center;z-index:28;pointer-events:none;font-family:"Black Han Sans";font-size:clamp(26px,5vw,52px);color:#fff;-webkit-text-stroke:2px var(--pink);text-shadow:0 0 24px var(--pink);display:none;padding:0 12px}
.chant.on{display:block;animation:chantPulse var(--beat) ease-out infinite}
.stage.chanting .title{opacity:0}
@keyframes chantPulse{0%{transform:scale(1.18)}100%{transform:scale(1)}}

/* speech bubble */
.bubble{position:absolute;left:50%;top:-118px;transform:translateX(-50%) scale(0);transform-origin:50% 100%;background:#fff;color:#1a1033;font-weight:900;font-size:21px;padding:10px 16px;border-radius:18px;white-space:nowrap;z-index:6;transition:transform .2s cubic-bezier(.3,1.6,.5,1);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.on{transform:translateX(-50%) scale(1)}

/* alert */
.alert{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);z-index:30;text-align:center;pointer-events:none;width:min(92%,520px)}
.alert .box{display:none;background:rgba(10,6,24,.82);backdrop-filter:blur(8px);border:2px solid var(--c);border-radius:18px;padding:12px 18px;box-shadow:0 0 40px var(--c)}
.alert.on .box{display:block;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.alert .who{font-size:15px;font-weight:700}
.alert .amt{font-family:"Black Han Sans";font-size:clamp(28px,5vw,46px);color:var(--c);line-height:1.15;text-shadow:0 0 18px var(--c)}
.alert .tag{display:inline-block;margin-top:4px;font-size:12px;font-weight:900;background:var(--c);color:#14092a;padding:2px 8px;border-radius:6px}
@keyframes pop{from{transform:scale(.4) translateY(-20px);opacity:0}to{transform:none;opacity:1}}

/* particles */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:25}
.p{position:absolute;will-change:transform,opacity}
.p-heart{font-size:30px;animation:floatUp 2.2s ease-out forwards}
@keyframes floatUp{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),-260px) scale(1.3);opacity:0}}
.p-conf{top:-30px;width:10px;height:16px;border-radius:2px;animation:fall var(--t) linear forwards}
.p-emoji{top:-50px;font-size:34px;animation:fall var(--t) linear forwards}
@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(var(--r))}}
.p-spark{width:8px;height:8px;border-radius:50%;animation:burst 1.1s ease-out forwards;box-shadow:0 0 10px currentColor}
@keyframes burst{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}

/* controls */
.don{display:flex;gap:6px;flex-wrap:wrap}
.dbtn{padding:9px 12px;border-radius:10px;font-weight:900;font-size:14px;background:var(--panel2);border:1px solid var(--line);transition:transform .08s}

<script>
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const fmt = n => Number(n).toLocaleString('ko-KR');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};

/* ================= SETUP / FACE EDITOR ================= */
const OUTFITS = ['#ff3d8b','#7b5cff','#18c29c','#ff8a00','#1e90ff','#222233'];
let outfit = store.get('xb_outfit') || OUTFITS[0];
const fc = $('#faceCanvas'), fctx = fc.getContext('2d');
let fimg = null, fz = 1, fx = 0, fy = 0;

function drawDefaultFace(ctx, S){
  ctx.fillStyle = '#ffd9b8'; ctx.fillRect(0, 0, S, S);
  ctx.fillStyle = '#3b2a20';
  ctx.beginPath(); ctx.ellipse(S*.36, S*.45, S*.04, S*.06, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(S*.64, S*.45, S*.04, S*.06, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,90,120,.35)';
  ctx.beginPath(); ctx.arc(S*.26, S*.6, S*.07, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(S*.74, S*.6, S*.07, 0, 7); ctx.fill();
  ctx.strokeStyle = '#3b2a20'; ctx.lineWidth = S*.025; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(S*.5, S*.58, S*.12, .15*Math.PI, .85*Math.PI); ctx.stroke();
  ctx.fillStyle = '#2a1a12';
  ctx.beginPath(); ctx.ellipse(S*.5, S*.08, S*.55, S*.22, 0, 0, 7); ctx.fill();
}
function drawFace(){
  const S = fc.width;
  fctx.clearRect(0, 0, S, S);
  if (!fimg) return drawDefaultFace(fctx, S);
  const base = Math.max(S / fimg.width, S / fimg.height) * fz;
  const w = fimg.width * base, h = fimg.height * base;
  fctx.drawImage(fimg, (S - w) / 2 + fx, (S - h) / 2 + fy, w, h);
}
function loadFace(src){
  const img = new Image();
  img.onload = () => { fimg = img; fz = 1; fx = fy = 0; $('#zoom').value = 1; $('#zoomRow').classList.remove('hidden'); $('#faceHint').textContent = '드래그해서 얼굴을 가운데로 맞춰주세요'; drawFace(); };
  img.src = src;
}
$('#faceInput').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  loadFace(URL.createObjectURL(f));
});
$('#zoom').addEventListener('input', e => { fz = +e.target.value; drawFace(); });
let drag = null;
fc.addEventListener('pointerdown', e => { if (!fimg) return; drag = {x: e.clientX, y: e.clientY}; fc.setPointerCapture(e.pointerId); });
fc.addEventListener('pointermove', e => {
  if (!drag) return;
  const k = fc.width / fc.clientWidth;
  fx += (e.clientX - drag.x) * k; fy += (e.clientY - drag.y) * k;
  drag = {x: e.clientX, y: e.clientY}; drawFace();
});
fc.addEventListener('pointerup', () => drag = null);
fc.addEventListener('wheel', e => { if (!fimg) return; e.preventDefault(); fz = Math.min(4, Math.max(1, fz - e.deltaY * .002)); $('#zoom').value = fz; drawFace(); }, {passive: false});

const sw = $('#swatches');
OUTFITS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'sw' + (c === outfit ? ' on' : ''); b.style.background = c; b.type = 'button'; b.setAttribute('aria-label', c);
  b.onclick = () => { outfit = c; sw.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); };
  sw.appendChild(b);
});
$('#nameInput').value = store.get('xb_name') || '';
const savedFace = store.get('xb_face');
if (savedFace) loadFace(savedFace); else drawFace();

/* ================= MUSIC (WebAudio, 직접 합성) ================= */
const Music = (() => {
  let ac, master, music, sfx, noiseBuf, timer, step = 0, nextTime = 0, playing = false, hype = 0, hypeUntil = 0, on = true;
  // 트랙별 16스텝 패턴: k=킥 s=스네어 h=하이햇(x 닫힘/o 열림) b=베이스(x 루트/o 옥타브) c=코드 l=리드(0~2 코드음, 3 옥타브 루트)
  const TRACKS = {
    main:    {bpm:124, prog:[[57,60,64],[53,57,60],[52,55,60],[55,59,62]], roots:[45,41,48,43], k:'x...x...x...x...', s:'....x.......x...', h:'..x...x...x...x.', b:'..x...x...x...x.', bw:'sawtooth', bc:650,  c:'x.....x...x.....', cw:'square',   cd:.22, l:'2.12..0.1.2...3.', lw:'square',   lo:12, ld:.22},
    bunny:   {bpm:136, prog:[[60,64,67],[59,62,67],[57,60,64],[57,60,65]], roots:[48,43,45,41], k:'x.....x.x.......', s:'....x.......x...', h:'x.x.x.x.x.x.x.x.', b:'x...x.o.x...x.o.', bw:'triangle', bc:1200, c:'..x...x...x...x.', cw:'triangle', cd:.12, l:'3.2.1.2.3.3.3...', lw:'triangle', lo:12, ld:.15},
    robot:   {bpm:120, prog:[[62,65,69],[58,62,65],[60,64,67],[57,61,64]], roots:[38,34,36,33], k:'x...x...x...x...', s:'....x.......x...', h:'xxxxxxxxxxxxxxxx', b:'x.xxx.xxx.xxx.xx', bw:'sawtooth', bc:500,  c:'x...............', cw:'square',   cd:.3,  l:'0.0.3...2.1.0...', lw:'square',   lo:12, ld:.1},
    surf:    {bpm:92,  prog:[[57,60,64],[55,59,62],[53,57,60],[52,55,59]], roots:[41,40,38,36], k:'x.........x.....', s:'........x.......', h:'..x...x...x...x.', b:'x.........x...x.', bw:'sine',     bc:800,  c:'x.......x.......', cw:'triangle', cd:.9,  l:'....2.1.....0.1.', lw:'triangle', lo:12, ld:.35},
    hip:     {bpm:98,  prog:[[57,60,64],[57,62,65],[55,59,64],[57,60,64]], roots:[45,38,40,45], k:'x...x...x...x...', s:'...x..x....x..x.', h:'..x...x...x...x.', b:'x..x..x.x..x..x.', bw:'sawtooth', bc:400,  c:'...x..x....x..x.', cw:'square',   cd:.12, l:'2..1..0.2..1..3.', lw:'square',   lo:12, ld:.18},
    disco:   {bpm:118, prog:[[62,65,69],[59,62,67],[60,64,67],[57,60,64]], roots:[38,43,36,45], k:'x...x...x...x...', s:'....x.......x...', h:'..o...o...o...o.', b:'xoxoxoxoxoxoxoxo', bw:'sawtooth', bc:900,  c:'..x...x...x...x.', cw:'sawtooth', cd:.15, l:'3.2.3.1.2.0.1...', lw:'square',   lo:12, ld:.2},
    penguin: {bpm:108, prog:[[60,64,67],[60,65,69],[59,62,67],[60,64,67]], roots:[48,41,43,48], k:'x.......x.......', s:'....x.......x...', h:'',                 b:'x...x...x...x...', bw:'triangle', bc:1000, c:'',                 cw:'triangle', cd:.1,  l:'0.1.2.3.2.1.0...', lw:'sine',     lo:24, ld:.12},
    crazy:   {bpm:160, prog:[[64,67,71],[60,64,67],[62,67,71],[62,66,69]], roots:[40,36,43,38], k:'x...x...x...x...', s:'....x.......x...', h:'xxxxxxxxxxxxxxxx', b:'xxxxxxxxxxxxxxxx', bw:'sawtooth', bc:700,  c:'x.x...x.x...x...', cw:'sawtooth', cd:.12, l:'3.3.2.3.1.2.3.0.', lw:'sawtooth', lo:12, ld:.12},
    spin:    {bpm:128, prog:[[57,60,64],[57,60,65],[55,59,62],[56,59,64]], roots:[45,41,43,40], k:'x...x...x...x...', s:'....x.......x...', h:'..x...x...x...x.', b:'..x...x...x...x.', bw:'sawtooth', bc:800,  c:'x.....x...x.....', cw:'square',   cd:.2,  l:'0123012301230123', lw:'triangle', lo:12, ld:.1},
  };
  let cur = 'main';
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function init(){
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ac.createDynamicsCompressor();
    master = ac.createGain(); master.gain.value = .8;
    master.connect(comp); comp.connect(ac.destination);
    music = ac.createGain(); music.gain.value = .5; music.connect(master);
    sfx = ac.createGain(); sfx.gain.value = .9; sfx.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function kick(t){
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .12);
    g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(.001, t + .35);
    o.connect(g); g.connect(music); o.start(t); o.stop(t + .4);
  }
  function noise(t, dur, type, freq, vol, dest = music){
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * .4); s.stop(t + dur + .02);
  }
  function tone(t, freq, dur, type, vol, dest = music, cut = 3000){
    const o = ac.createOscillator(); o.type = type; o.frequency.value = freq;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut;
    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(f); f.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .05);
  }
  function schedule(s, t){
    const T = TRACKS[cur];
    const bar = Math.floor(s / 16) % 4, st = s % 16, chord = T.prog[bar], root = T.roots[bar];
    const h = ac.currentTime < hypeUntil ? hype : 0;
    const section = Math.floor(s / 64) % 2;
    if (T.k[st] === 'x') kick(t);
    if (T.s[st] === 'x') noise(t, .18, 'bandpass', 1800, .5);
    if (T.h[st] === 'x') noise(t, .05, 'highpass', 7000, .26);
    else if (T.h[st] === 'o') noise(t, .22, 'highpass', 6000, .22);
    if (h >= 2 && st % 2 === 1) noise(t, .03, 'highpass', 9000, .16);
    const bb = T.b[st];
    if (bb === 'x' || bb === 'o') tone(t, mtof(root + (bb === 'o' ? 12 : 0)), .2, T.bw, .3, music, h ? T.bc * 1.7 : T.bc);
    if (T.c[st] === 'x') chord.forEach(n => tone(t, mtof(n + 12), T.cd, T.cw, .045, music, h ? 4500 : 2200));
    const ld = T.l[st];
    if (ld && ld !== '.' && (cur !== 'main' || section === 1 || h)){
      const d = +ld, n = (d < 3 ? chord[d] : chord[0] + 12) + T.lo + (h >= 2 ? 12 : 0);
      tone(t, mtof(n), T.ld, T.lw, .06, music, 2600);
    }
    if (h >= 1 && st % 2 === 1) tone(t, mtof(chord[(st >> 1) % 3] + 24), .1, 'triangle', .07);
  }
  function tick(){
    const spb = 60 / TRACKS[cur].bpm / 4;
    while (nextTime < ac.currentTime + .12){ schedule(step, nextTime); nextTime += spb; step++; }
  }
  return {
    unlock(){ if (!ac) init(); ac.resume(); },
    start(){ this.unlock(); if (playing) return; playing = true; step = 0; nextTime = ac.currentTime + .05; timer = setInterval(tick, 25); },
    stop(){ clearInterval(timer); playing = false; this.setTrack('main'); },
    setTrack(key){
      if (!TRACKS[key] || key === cur) return;
      cur = key; step = 0;
      document.documentElement.style.setProperty('--beat', (60 / TRACKS[key].bpm).toFixed(4) + 's');
    },
    toggle(){ on = !on; music.gain.setTargetAtTime(on ? .5 : 0, ac.currentTime, .05); return on; },
    hype(level, secs){ if (!ac) return; hype = Math.max(level, ac.currentTime < hypeUntil ? hype : 0); hypeUntil = Math.max(hypeUntil, ac.currentTime + secs); },
    ding(level){
      if (!ac) return;
      const t = ac.currentTime + .01;
      [84, 88, 91, 96].forEach((n, i) => tone(t + i * .07, mtof(n), .4, 'triangle', .2, sfx, 9000));
      if (level >= 3) [72, 76, 79, 84].forEach(n => tone(t + .32, mtof(n), 1.1, 'sawtooth', .06, sfx, 3200));
      if (level >= 4){
        const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 4;
        f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(8000, t + 1.2);
        const g = ac.createGain(); g.gain.setValueAtTime(.001, t); g.gain.exponentialRampToValueAtTime(.4, t + 1.15); g.gain.exponentialRampToValueAtTime(.001, t + 1.3);
        s.connect(f); f.connect(g); g.connect(sfx); s.start(t); s.stop(t + 1.35);
        noise(t + 1.2, 1.6, 'highpass', 4000, .5, sfx);
        [57, 64, 69, 72, 76].forEach(n => tone(t + 1.2, mtof(n), 1.6, 'sawtooth', .05, sfx, 4000));
      }
    }
  };
})();

/* donation flow */
function donate(donor, amount, chal = 'auto'){
  amount = Math.max(1, Math.floor(amount));
  S.queue.push({ donor, amount, chal });
  if (!S.busy) next();
}
function next(){
  const d = S.queue.shift();
  if (!d){ S.busy = false; setMode('idle'); Music.setTrack('main'); return; }
  S.busy = true; react(d);
}
function react({ donor, amount, chal }){
  const t = tierOf(amount);
  let key = null;
  if (chal === 'random' || (chal === 'auto' && t.lvl >= 3)) key = pick(CH_KEYS);
  else if (CHALLENGES[chal]) key = chal;
  const C = key && CHALLENGES[key];
  const rush = S.queue.length >= 3 ? .55 : 1;
  const dur = (C ? Math.max(t.dur, 7500) : t.dur) * rush;

  S.donors.set(donor, (S.donors.get(donor) || 0) + amount);
  S.total += amount;
  renderSheet(donor, amount);
  const top = [...S.donors.entries()].sort((a, b) => b[1] - a[1])[0];

  const al = $('#alert');
  al.style.setProperty('--c', t.color);
  $('#aWho').textContent = `${donor}님이 풍선을 쐈어요!`;
  $('#aAmt').textContent = `🎈 ${fmt(amount)}개`;
  $('#aTag').textContent = C ? `${C.emoji} ${C.name} 임명!` : t.label;
  al.classList.remove('on'); void al.offsetWidth; al.classList.add('on');
  later(() => al.classList.remove('on'), dur - 300);

  Music.setTrack(C ? C.track : 'main');
  Music.ding(t.lvl);
  shout(donor, amount, !!C);
  const chant = $('#chant');
  chant.textContent = `${donor} 업! ${donor} 업!`;
  chant.classList.add('on'); stage.classList.add('chanting');
  later(() => { chant.classList.remove('on'); stage.classList.remove('chanting'); }, dur - 200);

  chat('', `🎈 ${donor}님 풍선 ${fmt(amount)}개 후원! ${top[0] === donor ? '(현재 회장 👑)' : ''}`, true);
  if (C) chat('', `${C.emoji} ${donor}님이 「${C.name}」를 임명했습니다!`, true);
  for (let i = 0; i < Math.max(2, t.lvl); i++) later(() => chat(pick(CHATTERS), i % 2 ? pick(DONATE_TALK) : `${donor} 업! ${donor} 업!`), 300 + i * 350);

  ch.classList.remove('has-deco');
  if (C){
    setMode(C.mode);
    $('#deco').textContent = C.emoji; ch.classList.add('has-deco');
    later(() => ch.classList.remove('has-deco'), dur - 200);
    say(pick(C.lines).replace('{d}', donor), Math.min(dur - 300, 3200));
  } else {
    setMode(t.mode);
    say(pick(t.lines).replace('{d}', donor), Math.min(dur - 300, 3200));
  }
  if (t.lvl >= 4) ch.classList.add('crowned');

  if (t.lvl === 1) hearts(4);
  if (t.lvl === 2) hearts(12);
  if (t.lvl === 3){ hearts(6); confetti(50); Music.hype(1, dur / 1000 + 2); }
  if (t.lvl === 4){ confetti(90); confetti(25, ['💸','🎈','💵']); fireworks(3); Music.hype(2, dur / 1000 + 4); S.viewers += Math.floor(rand(80, 300)); }
  if (t.lvl === 5){
    stage.classList.add('party', 'shake');
    later(() => stage.classList.remove('shake'), 2200);
    later(() => stage.classList.remove('party'), dur - 500);
    confetti(140); confetti(50, ['💸','🎈','💵','💰','👑']); fireworks(7);
    Music.hype(2, dur / 1000 + 8);
    S.viewers += Math.floor(rand(500, 1500));
    later(() => { setMode('bow'); say(`${donor} 회장님 감사합니다 🙇`, 2200); }, dur - 2300);
  }
  if (t.lvl < 4) later(() => ch.classList.remove('crowned'), dur);
  else later(() => ch.classList.remove('crowned'), dur + 6000);

  if (S.total >= S.goal){
    later(() => { chat('', `🎉 목표 ${fmt(S.goal)}개 달성!! 다음 목표 갑니다`, true); say('목표 달성!!! 🎉', 2500); fireworks(5); S.goal *= 2; renderSheet(); }, 600);
  }
  later(next, dur);
}

$('#donateForm').addEventListener('submit', e => { e.preventDefault(); sendDonation(+$('#dAmt').value); });
$('#tAuto').addEventListener('click', e => { S.auto = !S.auto; e.currentTarget.classList.toggle('on', S.auto); });
$('#tMusic').addEventListener('click', e => { e.currentTarget.classList.toggle('on', Music.toggle()); });
$('#tTts').addEventListener('click', e => { ttsOn = !ttsOn; e.currentTarget.classList.toggle('on', ttsOn); if (!ttsOn && 'speechSynthesis' in window) speechSynthesis.cancel(); });
</script>
</body>
